name = "portfolio-api"
main = "src/index.ts"
compatibility_date = "2025-01-09"

# Submissions stored here, TTL set per-write to 90 days.
# Create with:  wrangler kv namespace create SUBMISSIONS
# Then paste the returned `id` below.
[[kv_namespaces]]
binding = "SUBMISSIONS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Secrets (set via `wrangler secret put NAME`, NOT in this file):
#   RESEND_API_KEY         — Resend API key for sending email
#   TURNSTILE_SECRET_KEY   — Cloudflare Turnstile secret
#   CONTACT_TO_EMAIL       — Destination address (e.g. abdullah.al.rifat2239@gmail.com)
#   CONTACT_FROM_EMAIL     — Verified sender on Resend (e.g. noreply@yourdomain.com)

# CORS — list every origin allowed to POST. Comma-separated.
[vars]
ALLOWED_ORIGINS = "http://localhost:5173,https://rifatbond007.github.io"
